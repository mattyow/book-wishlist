  :root {
    --display: "Monarcha", Georgia, serif;
    --ui: "Mint Book", system-ui, sans-serif;
    --paper: #f4efe4;
    --paper-2: #ece5d6;
    --ink: #2b2620;
    --ink-soft: #6b6256;
    --rule: #cbbfa8;
    --accent: #8a3324;
    --accent-soft: #b5573f;
    --gold: #9a7b3f;
    --shadow: rgba(43, 38, 32, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-synthesis: none; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(154,123,63,0.05), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(138,51,36,0.04), transparent 45%);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 17px;
    line-height: 1.5;
    padding: 2.2rem 1.2rem 4rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }

  header { border-bottom: 2px solid var(--ink); padding-bottom: 0.9rem; margin-bottom: 0.4rem; }
  .eyebrow { font-family: var(--ui); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--ink-soft); }
  h1 {
    font-family: var(--display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 3.6rem);
    line-height: 0.98; letter-spacing: -0.01em; margin-top: 0.2rem;
  }
  .meta { display: flex; justify-content: space-between; align-items: baseline; font-style: italic; color: var(--ink-soft); font-size: 0.92rem; margin-top: 0.5rem; }

  .toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 1.4rem 0 0.6rem; }
  .search { flex: 1; min-width: 180px; }
  input, select, textarea {
    font-family: var(--ui); font-size: 1rem; color: var(--ink);
    background: var(--paper-2); border: 1px solid var(--rule); border-radius: 2px;
    padding: 0.5rem 0.7rem; width: 100%; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select { cursor: pointer; }
  .toolbar select { width: auto; }

  /* Add form */
  .add-card {
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 3px; padding: 1rem; margin-bottom: 1.6rem;
    box-shadow: 0 1px 2px var(--shadow);
  }
  .add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
  .add-grid .full { grid-column: 1 / -1; }
  .row-actions { display: flex; gap: 0.6rem; align-items: center; margin-top: 0.7rem; flex-wrap: wrap; }

  button {
    font-family: var(--ui); font-weight: 500; cursor: pointer;
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    padding: 0.5rem 1.1rem; border-radius: 2px; font-size: 0.9rem; letter-spacing: 0.02em;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.ghost { background: transparent; color: var(--ink); }
  button.ghost:hover { background: var(--paper); }
  button.link-btn { border: none; background: none; color: var(--accent); padding: 0; font-family: var(--ui); font-style: italic; text-decoration: underline; }
  button.link-btn:hover { transform: none; color: var(--accent-soft); }

  .toggle-import { font-size: 0.85rem; color: var(--ink-soft); font-style: italic; cursor: pointer; text-decoration: underline; background: none; border: none; font-family: var(--ui); padding: 0; }
  .import-area { margin-top: 0.7rem; display: none; }
  .import-area.open { display: block; }
  .hint { font-size: 0.8rem; color: var(--ink-soft); font-style: italic; margin: 0.3rem 0 0.5rem; }

  /* List */
  .list { list-style: none; }
  .book {
    display: flex; gap: 0.9rem; align-items: flex-start;
    padding: 0.95rem 0.2rem; border-bottom: 1px solid var(--rule);
    animation: rise 0.35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .num { font-family: var(--ui); font-weight: 500; font-size: 0.85rem; color: var(--gold); min-width: 1.8rem; padding-top: 0.2rem; font-variant-numeric: tabular-nums; }
  .book-body { flex: 1; min-width: 0; }
  .title { font-family: var(--display); font-weight: 400; font-size: 1.24rem; letter-spacing: -0.005em; line-height: 1.2; }
  .author { font-style: italic; color: var(--ink-soft); font-size: 0.98rem; }
  .note { font-size: 0.92rem; color: var(--ink-soft); margin-top: 0.25rem; }
  .badges { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.4rem; flex-wrap: wrap; }
  .pill { font-family: var(--ui); font-weight: 500; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.12rem 0.5rem; border-radius: 2px; border: 1px solid var(--rule); color: var(--ink-soft); }
  .pill.high { border-color: var(--accent); color: var(--accent); }
  .pill.someday { opacity: 0.8; }
  .ext { color: var(--accent); text-decoration: none; font-style: italic; font-size: 0.88rem; }
  .ext:hover { text-decoration: underline; }
  .acts { display: flex; gap: 0.7rem; flex-shrink: 0; padding-top: 0.15rem; }
  .icon-btn { background: none; border: none; color: var(--ink-soft); cursor: pointer; font-family: var(--ui); font-style: italic; font-size: 0.85rem; padding: 0; text-decoration: underline; }
  .icon-btn:hover { color: var(--accent); transform: none; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--ink-soft); font-style: italic; }
  .empty .big { font-family: var(--display); font-size: 1.45rem; font-style: normal; color: var(--ink); margin-bottom: 0.4rem; }

  .status { font-size: 0.8rem; color: var(--ink-soft); font-style: italic; min-height: 1rem; margin-top: 0.4rem; }

  /* edit mode */
  .editing .add-grid { margin-bottom: 0; }

  #sync { font-size: 0.82rem; }
  #sync.ok { color: var(--gold); }
  #sync.err { color: var(--accent); font-style: normal; }
  .meta-right { display: flex; align-items: baseline; gap: 0.9rem; }
  .edit-toggle { font-family: var(--ui); font-weight: 500; font-style: normal; font-size: 0.8rem; letter-spacing: 0.04em; text-transform: uppercase; background: none; border: none; color: var(--accent); padding: 0; cursor: pointer; }
  .edit-toggle:hover { transform: none; color: var(--accent-soft); }
  .edit-toggle.on { color: var(--ink-soft); }

  .cat-input { margin-bottom: 0.4rem; }
  .cat-results { display: none; border: 1px solid var(--rule); border-radius: 2px; margin-bottom: 0.6rem; overflow: hidden; }
  .cat-results.open { display: block; }
  .cat-row { display: flex; gap: 0.7rem; align-items: center; padding: 0.55rem 0.7rem; cursor: pointer; border-bottom: 1px solid var(--rule); background: var(--paper); }
  .cat-row:last-child { border-bottom: none; }
  .cat-row:hover { background: var(--paper-2); }
  .cat-cover { width: 34px; height: 50px; object-fit: cover; background: var(--paper-2); border: 1px solid var(--rule); flex-shrink: 0; }
  .cat-cover.blank { display: flex; align-items: center; justify-content: center; font-family: var(--display); color: var(--gold); font-size: 1.1rem; }
  .cat-info { flex: 1; min-width: 0; }
  .cat-t { font-family: var(--display); font-size: 1.02rem; line-height: 1.15; }
  .cat-a { font-style: italic; color: var(--ink-soft); font-size: 0.9rem; }
  .cat-add { font-family: var(--ui); font-weight: 500; font-size: 0.78rem; color: var(--accent); border: 1px solid var(--rule); border-radius: 2px; padding: 0.25rem 0.6rem; flex-shrink: 0; }
  .cat-note { padding: 0.55rem 0.7rem; font-style: italic; color: var(--ink-soft); font-size: 0.88rem; }

  .manual-area { display: none; margin-top: 0.7rem; }
  .manual-area.open { display: block; }

  .cover { width: 46px; height: 68px; object-fit: cover; background: var(--paper-2); border: 1px solid var(--rule); flex-shrink: 0; }
  .cover.blank { display: flex; align-items: center; justify-content: center; font-family: var(--display); color: var(--gold); font-size: 1.4rem; }

  .gate { position: fixed; inset: 0; background: rgba(43,38,32,0.55); display: flex; align-items: center; justify-content: center; padding: 1.2rem; z-index: 50; }
  .gate-card { background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; padding: 1.6rem; max-width: 380px; width: 100%; box-shadow: 0 12px 40px rgba(43,38,32,0.3); }
  .gate-title { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 0.3rem 0 0.5rem; }
  .gate-msg { font-size: 0.92rem; color: var(--ink-soft); margin-bottom: 0.9rem; }
  .gate-msg.err { color: var(--accent); font-style: italic; }
  .gate-card input { margin-bottom: 0.7rem; }

  @media (max-width: 520px) {
    .add-grid { grid-template-columns: 1fr; }
    .book { flex-wrap: wrap; }
    .acts { width: 100%; padding-top: 0.5rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">A Personal Catalogue of Books Not Yet Owned</div>
    <h1>The Reading List</h1>
    <div class="meta">
      <span id="count">&nbsp;</span>
      <span class="meta-right"><span id="sync"></span><button class="edit-toggle" id="editToggle">Edit list</button></span>
    </div>
  </header>

  <div class="add-card" id="addCard">
    <input id="catSearch" class="full cat-input" placeholder="Search a title or author to add…" autocomplete="off">
    <div id="catResults" class="cat-results"></div>
    <div class="row-actions">
      <button class="toggle-import" id="toggleManual">add by hand instead →</button>
      <button class="toggle-import" id="toggleImport">or paste a list →</button>
    </div>

    <div class="manual-area" id="manualArea">
      <div class="add-grid">
        <input id="fTitle" class="full" placeholder="Title" autocomplete="off">
        <input id="fAuthor" placeholder="Author">
        <select id="fPriority">
          <option value="want">Want to read</option>
          <option value="high">Top of the pile</option>
          <option value="someday">Someday / maybe</option>
        </select>
        <input id="fIsbn" placeholder="ISBN (optional)">
        <input id="fNote" class="full" placeholder="Note (optional) — why, edition, who recommended it…">
        <input id="fLink" class="full" placeholder="Link (optional)">
      </div>
      <div class="row-actions">
        <button id="addBtn">Add to list</button>
        <button class="ghost" id="cancelEdit" style="display:none">Cancel</button>
      </div>
    </div>

    <div class="import-area" id="importArea">
      <p class="hint">One book per line. Use a dash or comma to separate author: <em>Middlemarch — George Eliot</em></p>
      <textarea id="importText" rows="5" placeholder="The Idiot — Dostoevsky&#10;Pachinko, Min Jin Lee&#10;Just a title on its own works too"></textarea>
      <div class="row-actions">
        <button id="importBtn">Import these</button>
      </div>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="gate" id="gate" style="display:none">
    <div class="gate-card">
      <div class="eyebrow">Edit access</div>
      <h2 class="gate-title">Enter your passphrase</h2>
      <p class="gate-msg" id="gateMsg">Anyone can view this list. Editing needs your passphrase — enter it once on this device.</p>
      <input id="gateInput" type="password" placeholder="Passphrase" autocomplete="current-password">
      <div class="row-actions">
        <button id="gateBtn">Unlock editing</button>
        <button class="ghost" id="gateCancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search"><input id="searchBox" placeholder="Search title, author, note…" autocomplete="off"></div>
    <select id="sortBy">
      <option value="added">Newest first</option>
      <option value="added-old">Oldest first</option>
      <option value="title">By title</option>
      <option value="author">By author</option>
      <option value="priority">By priority</option>
    </select>
    <button class="ghost" id="exportBtn" title="Download your list as a CSV file">Export CSV</button>
  </div>

  <ul class="list" id="list"></ul>
</div>

<script>
  const AUTH_KEY = "reading-list:key";
  let books = [];
  let editingId = null;
  let listKey = localStorage.getItem(AUTH_KEY) || "";
  let canEdit = !!listKey;

  const $ = id => document.getElementById(id);
  const statusEl = $("status");
  function flash(msg) { statusEl.textContent = msg; if (msg) setTimeout(() => { if (statusEl.textContent === msg) statusEl.textContent = ""; }, 2600); }

  let syncTimer = null;
  function setSync(msg, kind) {
    const el = $("sync");
    el.textContent = msg;
    el.className = kind === "ok" ? "ok" : kind === "err" ? "err" : "";
    clearTimeout(syncTimer);
    if (kind === "ok") syncTimer = setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2000);
  }

  function headers() { return { "Content-Type": "application/json", "x-list-key": listKey }; }

  // Show or hide all editing affordances based on edit mode.
  function applyMode() {
    $("addCard").style.display = canEdit ? "" : "none";
    const t = $("editToggle");
    t.textContent = canEdit ? "Done editing" : "Edit list";
    t.classList.toggle("on", canEdit);
    render();
  }

  function showGate(msg, isErr) {
    $("gate").style.display = "flex";
    const m = $("gateMsg");
    if (msg) { m.textContent = msg; m.className = "gate-msg" + (isErr ? " err" : ""); }
    setTimeout(() => $("gateInput").focus(), 50);
  }
  function hideGate() { $("gate").style.display = "none"; }

  // Reads are public — no passphrase needed to view.
  async function load() {
    setSync("Loading…");
    try {
      const res = await fetch("/api/list");
      if (!res.ok) throw new Error("load");
      const data = await res.json();
      books = Array.isArray(data) ? data : [];
      setSync("");
      applyMode();
    } catch (e) {
      setSync("Couldn't reach the server — check your connection.", "err");
    }
  }

  async function save() {
    if (!canEdit) return;
    setSync("Saving…");
    try {
      const res = await fetch("/api/list", { method: "PUT", headers: headers(), body: JSON.stringify(books) });
      if (res.status === 401) {
        listKey = ""; canEdit = false; localStorage.removeItem(AUTH_KEY);
        applyMode();
        showGate("That passphrase didn't work. Try again.", true);
        setSync("");
        return;
      }
      if (!res.ok) throw new Error("save");
      setSync("All changes saved", "ok");
    } catch (e) {
      setSync("Save failed — your last change may not be stored.", "err");
    }
  }

  function unlock() {
    const v = $("gateInput").value.trim();
    if (!v) { $("gateInput").focus(); return; }
    listKey = v; canEdit = true;
    localStorage.setItem(AUTH_KEY, v);
    $("gateInput").value = "";
    hideGate();
    applyMode();
  }

  function lock() {
    listKey = ""; canEdit = false;
    localStorage.removeItem(AUTH_KEY);
    if (editingId) endEdit();
    applyMode();
  }

  function toggleEdit() {
    if (canEdit) lock();
    else showGate();
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function addBook(b) {
    books.push({ id: uid(), added: Date.now(), priority: "want", ...b });
  }

  function priorityRank(p) { return p === "high" ? 0 : p === "want" ? 1 : 2; }
  function priorityLabel(p) { return p === "high" ? "Top of the pile" : p === "someday" ? "Someday" : "Want to read"; }

  function currentSorted() {
    const q = $("searchBox").value.trim().toLowerCase();
    let arr = books.filter(b => !q || (b.title + " " + (b.author||"") + " " + (b.note||"")).toLowerCase().includes(q));
    const sort = $("sortBy").value;
    arr = arr.slice();
    if (sort === "added") arr.sort((a,b) => b.added - a.added);
    else if (sort === "added-old") arr.sort((a,b) => a.added - b.added);
    else if (sort === "title") arr.sort((a,b) => a.title.localeCompare(b.title));
    else if (sort === "author") arr.sort((a,b) => (a.author||"~").localeCompare(b.author||"~"));
    else if (sort === "priority") arr.sort((a,b) => priorityRank(a.priority) - priorityRank(b.priority) || b.added - a.added);
    return arr;
  }

  function esc(s) { return (s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
  function safeLink(u) {
    if (!u) return "";
    let url = u.trim();
    if (!/^https?:\/\//i.test(url)) url = "https://" + url;
    return url;
  }

  function render() {
    const arr = currentSorted();
    const total = books.length;
    $("count").textContent = total === 0 ? "Nothing here yet" : total + (total === 1 ? " book" : " books") + " waiting";

    const list = $("list");
    if (total === 0) {
      list.innerHTML = canEdit
        ? `<div class="empty"><div class="big">An empty shelf.</div>Search a title above to add your first book, or paste a whole list at once.</div>`
        : `<div class="empty"><div class="big">An empty shelf.</div>Nothing here yet.</div>`;
      return;
    }
    if (arr.length === 0) {
      list.innerHTML = `<div class="empty"><div class="big">No matches.</div>Try a different search.</div>`;
      return;
    }
    list.innerHTML = arr.map((b, i) => {
      const link = safeLink(b.link);
      const pcls = b.priority === "high" ? "high" : b.priority === "someday" ? "someday" : "";
      const cover = b.cover
        ? `<img class="cover" src="${esc(b.cover)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'cover blank\\'>${esc((b.title[0]||'?').toUpperCase())}</div>'">`
        : `<div class="cover blank">${esc((b.title[0]||'?').toUpperCase())}</div>`;
      return `<li class="book" style="animation-delay:${Math.min(i*22,300)}ms">
        <div class="num">${String(i+1).padStart(2,'0')}</div>
        ${cover}
        <div class="book-body">
          <div class="title">${esc(b.title)}</div>
          ${b.author ? `<div class="author">${esc(b.author)}</div>` : ""}
          ${b.note ? `<div class="note">${esc(b.note)}</div>` : ""}
          <div class="badges">
            <span class="pill ${pcls}">${priorityLabel(b.priority)}</span>
            ${link ? `<a class="ext" href="${esc(link)}" target="_blank" rel="noopener">view link ↗</a>` : ""}
          </div>
        </div>
        ${canEdit ? `<div class="acts">
          <button class="icon-btn" data-edit="${b.id}">edit</button>
          <button class="icon-btn" data-del="${b.id}">remove</button>
        </div>` : ""}
      </li>`;
    }).join("");

    if (canEdit) {
      list.querySelectorAll("[data-del]").forEach(el => el.onclick = () => removeBook(el.dataset.del));
      list.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => startEdit(el.dataset.edit));
    }
  }

  function clearForm() {
    $("fTitle").value = ""; $("fAuthor").value = ""; $("fNote").value = ""; $("fLink").value = "";
    $("fIsbn").value = ""; $("fPriority").value = "want";
  }

  async function onAdd() {
    const title = $("fTitle").value.trim();
    if (!title) { $("fTitle").focus(); flash("A title, at least."); return; }
    const data = {
      title,
      author: $("fAuthor").value.trim(),
      isbn: $("fIsbn").value.trim(),
      note: $("fNote").value.trim(),
      link: $("fLink").value.trim(),
      priority: $("fPriority").value
    };
    if (editingId) {
      const b = books.find(x => x.id === editingId);
      if (b) Object.assign(b, data);
      endEdit();
      flash("Updated.");
    } else {
      addBook(data);
      flash("Added.");
    }
    clearForm();
    $("fTitle").focus();
    render();
    await save();
  }

  function startEdit(id) {
    const b = books.find(x => x.id === id);
    if (!b) return;
    editingId = id;
    $("fTitle").value = b.title; $("fAuthor").value = b.author || "";
    $("fIsbn").value = b.isbn || "";
    $("fNote").value = b.note || ""; $("fLink").value = b.link || "";
    $("fPriority").value = b.priority || "want";
    $("addBtn").textContent = "Save changes";
    $("cancelEdit").style.display = "";
    $("addCard").classList.add("editing");
    $("fTitle").focus();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  function endEdit() {
    editingId = null;
    $("addBtn").textContent = "Add to list";
    $("cancelEdit").style.display = "none";
    $("addCard").classList.remove("editing");
    clearForm();
  }

  async function removeBook(id) {
    books = books.filter(b => b.id !== id);
    if (editingId === id) endEdit();
    render();
    await save();
    flash("Removed.");
  }

  function parseImportLine(line) {
    const raw = line.trim();
    if (!raw) return null;
    // split on em/en dash, " - ", or comma
    let parts = raw.split(/\s+[—–-]\s+/);
    if (parts.length < 2) parts = raw.split(/,(.+)/).filter(Boolean);
    if (parts.length >= 2) return { title: parts[0].trim(), author: parts[1].trim() };
    return { title: raw, author: "" };
  }

  async function onImport() {
    const text = $("importText").value;
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    if (!lines.length) { flash("Nothing to import."); return; }
    let n = 0;
    lines.forEach(line => { const p = parseImportLine(line); if (p && p.title) { addBook(p); n++; } });
    $("importText").value = "";
    $("importArea").classList.remove("open");
    render();
    await save();
    flash(n + (n === 1 ? " book imported." : " books imported."));
  }

  // ---------- Catalog search (Open Library) ----------
  let catTimer = null, catSeq = 0;

  function onCatInput() {
    const q = $("catSearch").value.trim();
    clearTimeout(catTimer);
    if (q.length < 3) { closeCat(); return; }
    catTimer = setTimeout(() => runCat(q), 300);
  }

  function closeCat() { const r = $("catResults"); r.className = "cat-results"; r.innerHTML = ""; }

  async function runCat(q) {
    const seq = ++catSeq;
    const r = $("catResults");
    r.className = "cat-results open";
    r.innerHTML = `<div class="cat-note">Searching…</div>`;
    try {
      const url = "https://openlibrary.org/search.json?limit=6&fields=title,author_name,first_publish_year,cover_i,key,isbn&q=" + encodeURIComponent(q);
      const res = await fetch(url);
      const data = await res.json();
      if (seq !== catSeq) return; // a newer search superseded this one
      const docs = (data.docs || []).filter(d => d.title);
      if (!docs.length) { r.innerHTML = `<div class="cat-note">No matches. You can still add it by hand.</div>`; return; }
      r.innerHTML = docs.map((d, i) => {
        const author = (d.author_name && d.author_name[0]) || "";
        const yr = d.first_publish_year ? " · " + d.first_publish_year : "";
        const cov = d.cover_i
          ? `<img class="cat-cover" src="https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg" alt="">`
          : `<div class="cat-cover blank">${esc((d.title[0]||'?').toUpperCase())}</div>`;
        return `<div class="cat-row" data-i="${i}">
          ${cov}
          <div class="cat-info">
            <div class="cat-t">${esc(d.title)}</div>
            <div class="cat-a">${esc(author)}${yr}</div>
          </div>
          <span class="cat-add">add +</span>
        </div>`;
      }).join("");
      r.querySelectorAll(".cat-row").forEach(el => el.onclick = () => pickCat(docs[+el.dataset.i]));
    } catch (e) {
      if (seq === catSeq) r.innerHTML = `<div class="cat-note">Search unavailable right now. Add by hand instead.</div>`;
    }
  }

  async function pickCat(d) {
    const isbn = pickIsbn(d.isbn);
    addBook({
      title: d.title,
      author: (d.author_name && d.author_name[0]) || "",
      isbn: isbn,
      cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg` : "",
      link: d.key ? "https://openlibrary.org" + d.key : ""
    });
    $("catSearch").value = "";
    closeCat();
    render();
    await save();
    flash("Added.");
  }

  function pickIsbn(list) {
    if (!Array.isArray(list) || !list.length) return "";
    const thirteen = list.find(x => String(x).replace(/[^0-9Xx]/g, "").length === 13);
    return thirteen || list[0];
  }

  // ---------- CSV export (Title, Author, ISBN) ----------
  function csvCell(v) {
    const s = (v == null ? "" : String(v));
    // Quote if it contains comma, quote, or newline; escape inner quotes by doubling.
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function exportCsv() {
    if (!books.length) { flash("Nothing to export yet."); return; }
    const header = ["Title", "Author", "ISBN"];
    const rows = books.map(b => [csvCell(b.title), csvCell(b.author || ""), csvCell(b.isbn || "")].join(","));
    // Leading BOM so Excel reads UTF-8 (accented author names) correctly.
    const csv = "\uFEFF" + header.join(",") + "\n" + rows.join("\n") + "\n";
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = "reading-list-" + date + ".csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    flash("Exported " + books.length + (books.length === 1 ? " book." : " books."));
  }

  $("addBtn").onclick = onAdd;
  $("cancelEdit").onclick = endEdit;
  $("importBtn").onclick = onImport;
  $("toggleImport").onclick = () => { $("importArea").classList.toggle("open"); $("manualArea").classList.remove("open"); };
  $("toggleManual").onclick = () => { $("manualArea").classList.toggle("open"); $("importArea").classList.remove("open"); };
  $("searchBox").oninput = render;
  $("sortBy").onchange = render;
  $("exportBtn").onclick = exportCsv;
  $("fTitle").addEventListener("keydown", e => { if (e.key === "Enter") onAdd(); });
  $("fAuthor").addEventListener("keydown", e => { if (e.key === "Enter") onAdd(); });
  $("catSearch").addEventListener("input", onCatInput);
  $("editToggle").onclick = toggleEdit;
  $("gateBtn").onclick = unlock;
  $("gateCancel").onclick = hideGate;
  $("gateInput").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
  $("gate").addEventListener("click", e => { if (e.target.id === "gate") hideGate(); });
  document.addEventListener("click", e => { if (!e.target.closest(".add-card")) closeCat(); });

  load();
</script>
</body>
</html>
